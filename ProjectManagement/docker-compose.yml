services:
  mysql:
    image: mysql:8.0
    container_name: pm_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=ProjectManagement!2024
      - MYSQL_DATABASE=projectmanagementdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  webapi:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pm_web
    restart: always
    depends_on:
      mysql:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=projectmanagementdb;Uid=root;Pwd=ProjectManagement!2024;
      - Jwt__Issuer=ProjectManagement
      - Jwt__Audience=ProjectManagement
      - Jwt__Key=ProjectManagement_SecretKey_Minimum_32_Characters_Long!!!
      - ASPNETCORE_ENVIRONMENT=Production
      # Un-comment the lines below to activate email/AI features when you have the keys
      # - Smtp__User=YourEmail@gmail.com
      # - Smtp__Password=YourAppPassword
      # - Gemini__ApiKey=YourGeminiKeyHere
      
volumes:
  mysql_data:
