<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management</title>
    <link rel="stylesheet" href="./css/site.css">
    <!-- Development version -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Production version -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/js/auth.js"></script>
</head>
<body>
    <div class="flex h-screen items-stretch">
        <div id="sidebar-container" class="h-full shrink-0"></div>
        <main class="flex-1 p-6 overflow-y-auto ml-64">
            <div class="flex justify-end">
                <button id="open-create-project" class="inline-flex items-center gap-2 rounded-xl bg-blue-600 text-white px-4 py-2 shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14" /><path d="M5 12h14" /></svg>
                    Create project
                </button>
            </div>
            <section class="max-w-7xl mx-auto">
                <h1 class="text-5xl font-semibold text-gray-900 tracking-tight text-center mt-8">Welcome back!</h1>

                <div class="flex items-center gap-2 mt-10 px-2 text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 7v6l4 2" />
                    </svg>
                    <span class="text-sm">Recently visited</span>
                </div>

                <div id="projects-list-container" class="mt-4 gap-4 flex overflow-x-auto py-4 px-2">

                </div>
            </section>
        </main>
    </div>

    <!-- Modal: Create Project -->
    <div id="create-project-backdrop" class="fixed inset-0 z-40 hidden bg-black/40 opacity-0 transition-opacity duration-300"></div>
    <div id="create-project-modal" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto">
        <div class="min-h-full w-full p-4" id="modal-outer">
            <div id="create-project-content" class="mx-auto w-full max-w-lg rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-300 ease-out" role="dialog" aria-modal="true">
                <div class="p-6">
                    <h2 class="text-2xl font-semibold text-gray-900">Create a new project</h2>
                    <p class="mt-1 text-sm text-gray-600">Welcome! Create a new project to get started.</p>

                    <form id="create-project-form" class="mt-6 space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Project name<span class="text-red-500">*</span></label>
                            <input id="project-name" type="text" required class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" placeholder="Blog CMS" />
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Description</label>
                            <textarea id="project-description" rows="3" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" placeholder="Optional description..."></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Project Type<span class="text-red-500">*</span></label>
                            <div class="mt-2 space-y-2">
                                <label class="flex items-center">
                                    <input type="radio" name="project-type" value="Kanban" checked class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="ml-2 text-sm text-gray-700">Kanban - Quản lý task theo bảng</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="project-type" value="Scrum" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="ml-2 text-sm text-gray-700">Scrum - Quản lý theo sprint</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Add members</label>
                            <div class="relative">
                                <input id="member-search" type="text" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" placeholder="Search by email..." />
                                <div id="member-suggestions" class="absolute z-10 mt-1 hidden w-full overflow-hidden rounded-xl border border-gray-200 bg-white shadow">
                                    <!-- suggestions injected here -->
                                </div>
                            </div>
                            <div id="selected-members" class="mt-2 flex flex-wrap gap-2"></div>
                        </div>

                        <div class="flex items-center justify-between pt-2">
                            <button type="button" id="cancel-create-project" class="rounded-xl border border-gray-300 bg-white px-4 py-2 text-gray-700 hover:bg-gray-50">Cancel</button>
                            <button type="submit" class="rounded-xl bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Create project</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar phải được tải trước tiên vì các script khác phụ thuộc vào nó -->
    <script type="module" src="/js/sidebar.js"></script>
    <!-- Các script còn lại -->
    <script type="module" src="/js/project-sidebar.js?v=2"></script>
    <script type="module" src="/js/home.js?v=1"></script>
    <script type="module" src="/js/project-modal.js?v=2"></script>
    <script type="module" src="/js/settings-modal.js?v=2"></script>
    <script type="module" src="/js/user-settings-autosave.js?v=1"></script>

    <script>
        // Demo launcher: add a floating button to open settings anywhere
        (function () {
            const btn = document.createElement('button');
            btn.className = 'fixed bottom-6 right-6 rounded-full bg-gray-800 text-white px-4 py-2 shadow hover:bg-gray-900';
            btn.textContent = 'Settings';
            btn.addEventListener('click', () => window.settingsModal?.open());
            document.body.appendChild(btn);
        })();
    </script>
</body>
</html>
