<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

</head>
<body>
    <div class="container max-w-full mx-auto flex flex-col items-center mt-10">
        <h2 class="text-xl font-medium ">Create your profile</h2>
        <h1 class="mb-4 text-2xl font-medium text-gray-300">Make your profile memorable</h1>
        <form id="registerForm" class="flex flex-col w-1/3 mt-2 items-center gap-2">
            <div class="flex flex-col items-center gap-2">
                <!-- <div id="avatarPreview" class="w-24 h-24 rounded-full bg-gray-200 mb-4 overflow-hidden"></div>
                <label class="bg-gray-200 px-3 py-1 rounded text-xs cursor-pointer" for="file-upload">Chọn ảnh của bạn
                    <input id="file-upload" type="file" class="hidden" accept="image/*">
                </label>
                <p id="file-error" class="text-red-500 text-xs mt-1"></p> -->


                <div class="mt-1 flex flex-col w-[340px]">
                    <label for="email" class="block text-[14px] font-medium mb-2 text-left text-gray-400">Enter your email</label>
                    <div class="relative w-full">
                        <input id="email" type="email" placeholder="Email" class="border border-gray-200 px-[10px] py-1.5 rounded-lg text-base text-gray-500 placeholder-gray-400 w-full">
                        <button id="requestOtpButton" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-blue-500 cursor-pointer hover:text-blue-800">
                            <i id="evelopeIcon" class="far fa-envelope mr-1"></i>Nhận Code</button>
                    </div>
                </div>

                <div class="mt-1 flex flex-col w-[340px]">
                    <label for="otp" class="block text-[14px] font-medium mb-2 text-left text-gray-400">Enter registeration code</label>
                    <input id="otp" type="text" placeholder="Exp: aBc03" class="border border-gray-200 px-[10px] py-1.5 rounded-lg text-base text-gray-500 placeholder-gray-400">
                </div>

                <div class="mt-1 flex flex-col w-[340px]">
                    <label for="name" class="block text-[14px] font-medium mb-2 text-left text-gray-400">Enter your name</label>
                    <input id="name" type="text" placeholder="Name" class="border border-gray-200 px-[10px] py-1.5 rounded-lg text-base text-gray-500 placeholder-gray-400 w-full" required>
                </div>

                <div class="mt-1 flex flex-col w-[340px]">
                    <label for="password" class="block text-[14px] font-medium mb-2 text-left text-gray-400">Enter your password</label>
                    <div class="relative w-full">
                        <input id="password" type="password" placeholder="Password" class="border border-gray-200 px-[10px] py-1.5 rounded-lg text-base text-gray-500 placeholder-gray-400 w-full">
                        <button id="togglePassword" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 cursor-pointer">
                            <i id="eyeIcon" class="fa-solid fa-eye mr-1"></i></button>
                    </div>
                </div>
            </div>
            <div id="message" class="text-[12px] text-center"></div>
            <button type="button" id="registerButton" class="mt-1 w-[340px] bg-black text-white py-2 rounded hover:bg-gray-700 transition cursor-pointer">Continue</button>
            <div class="flex items-center mt-1 w-[340px]">
                <input type="checkbox" class="w-3 h-3 accent-gray-500 cursor-pointer">
                <span class="text-xs text-gray-400 ml-2">I agree to the <a href="#" class="text-blue-500 text-xs underline">Terms of Service</a>
                     and <a href="#" class="text-blue-500 text-xs underline">Privacy Policy</a></span>
            </div>
        </form>
    </div>

<!-- Loading Modal -->
<div id="loadingModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-xl flex items-center">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-gray-700">Đăng ký tài khoản thành công</p>
    </div>
</div>
</body>
<script src="/js/register.js" defer></script>
</html>
