<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

</head>
<body>
    <div class="container max-w-full mx-auto flex flex-col items-center mt-24">
        <h2 class="text-xl font-medium ">Create your profile</h2>
        <h1 class="mb-4 text-2xl font-medium text-gray-300">Make your profile memorable</h1>
        <form class="flex flex-col w-1/3 mt-10">
            <div class="flex flex-col items-center">
                <div id="avatarPreview" class="w-24 h-24 rounded-full bg-gray-200 mb-4 overflow-hidden"></div>
                <label class="bg-gray-200 px-3 py-1 rounded text-xs cursor-pointer" for="file-upload">Chọn ảnh của bạn
                    <input id="file-upload" type="file" class="hidden" accept="image/*">
                </label>
                <p id="file-error" class="text-red-500 text-xs mt-2"></p>
                <div class="mt-10 flex flex-col w-[340px]">
                    <label for="name" class="block text-base font-medium mb-2 text-left text-gray-400">Enter your name</label>
                    <input id="name" type="text" placeholder="Name" class="border border-gray-200 px-3 py-2 rounded-lg text-base text-gray-500 placeholder-gray-400">
                </div>
                <div class="mt-1 flex flex-col w-[340px]">
                    <label for="password" class="block text-base font-medium mb-2 text-left text-gray-400">Enter your password</label>
                    <!-- <input id="password" type="password" placeholder="Password" class="border border-gray-200 px-3 py-2 rounded-lg text-base text-gray-500 placeholder-gray-400"> -->
                    <div class="relative w-full">
                        <input id="password" type="password" placeholder="Password" class="border border-gray-200 px-3 py-2 rounded-lg text-base text-gray-500 placeholder-gray-400 w-full">
                        <button id="togglePassword" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 cursor-pointer">
                            <i id="eyeIcon" class="fa-solid fa-eye mr-1"></i></button>
                    </div>
                </div>
                <button class="mt-10 w-[340px] bg-black text-white py-2 rounded hover:bg-gray-700 transition cursor-pointer">Continue</button>
                <div class="flex items-center mt-6 w-[340px]">
                    <input type="checkbox" class="w-3 h-3 accent-gray-500 cursor-pointer">
                    <span class="text-xs text-gray-400 ml-2">I agree to the <a href="#" class="text-blue-500 text-xs underline">Terms of Service</a>
                         and <a href="#" class="text-blue-500 text-xs underline">Privacy Policy</a></span>
                </div>
            </div>
        </form>
    </div>
</body>
<script>
    const passwordInput = document.getElementById('password');
    const togglePasswordButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordButton.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        // Đổi icon mắt
        if(type === 'password') {
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        } else {
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        }
    });
    // Xem trước ảnh upload
    const fileInput = document.getElementById('file-upload');
    const avatarPreview = document.getElementById('avatarPreview');
    const fileError = document.getElementById('file-error');

    fileInput.addEventListener('change', function(e) { //thêm sự kiện change khi chọn file hoặc hủy chọn 
        const file = e.target.files && e.target.files[0]; // lấy file đầu tiên được chọn
        fileError.textContent = ''; 
        if (!file) return;
        // Kiểm tra kiểu file có phải image ko 
        if (!file.type.startsWith('image/')) {
            fileError.textContent = 'Please select an image file.';
            fileInput.value = '';
            return;
        }
        // Kiểm tra kích thước file
        const maxSize = 2 * 1024 * 1024; // 2MB
        if (file.size > maxSize) {
            fileError.textContent = 'Image is too large (max 2MB).';
            fileInput.value = '';
            return;
        }

        // Tạo url trỏ tới file
        const url = URL.createObjectURL(file);
        // tạo thẻ img gán src là url và add vào id avatarpreview 
        avatarPreview.innerHTML = '';
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Avatar preview';
        img.className = 'w-full h-full object-cover';
        avatarPreview.appendChild(img);

        // giải phóng bộ nhớ khi ảnh load xong
        img.onload = () => URL.revokeObjectURL(url);
    });
</script>
</html>
