<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link rel="stylesheet" href="./css/site.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/js/auth.js"></script>
</head>
<body>
    <div class="flex h-screen items-stretch">
        <!-- Sidebar sẽ được load vào đây -->
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <!-- Nội dung chính của trang chi tiết project -->
        <main id="project-detail-container" class="flex-1 p-6 overflow-y-auto ml-64">
            <!-- Header: Tên và mô tả project -->
            <header class="mb-8 flex flex-row items-center justify-between border rounded-xl px-3 py-2">
                <div class="flex flex-col border-r pr-2 ">
                    <h1 id="project-name" class="text-2xl font-medium text-gray-900">Đang tải...</h1>
                </div>
                <div class="flex flex-row gap-2 items-center justify-center">
                    <div id="member-list" class="-space-x-3 flex flex-row items-center justify-center border-r pr-2">
                        <!-- Danh sách thành viên sẽ được chèn vào đây -->
                    </div>
                    <div role="button" id="add-member-btn" class="inline-flex items-center gap-2 rounded-xl bg-black text-white px-4 py-2 shadow">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><line x1="19" x2="19" y1="8" y2="14" /><line x1="22" x2="16" y1="11" y2="11" /></svg>
                        Invite
                    </div>
                </div>
            </header>

            <!-- Khu vực nội dung chính của project (Kanban/Scrum) -->
            <section id="project-content" class="mt-10">
                <h2 class="text-2xl font-semibold text-gray-800">Bảng công việc</h2>
                <div class="mt-4 p-6 bg-gray-100 rounded-xl border border-dashed">
                    <p class="text-center text-gray-500">Nội dung Kanban/Scrum sẽ được hiển thị ở đây.</p>
                </div>
            </section>
        </main>
    </div>



    <!-- modal invite members -->
        <div id="invite-backdrop" class="fixed inset-0 z-40 hidden bg-black/40"></div>
        <div id="invite-modal" class="fixed inset-0 z-50 items-center hidden justify-center overflow-y-auto">
            <div class="min-h-full w-full p-4" id="modal-outer">
                <div class="mx-auto w-full max-w-lg rounded-2xl bg-white shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="invite-modal-title">
                    <div class="p-6">
                        <div class="flex flex-row items-center justify-between pb-2 border-b">
                            <div class="flex flex-col justify-center">
                                <h2 id="invite-modal-title" class="text-lg font-medium text-gray-900">Invite members to project</h2>
                                <p class="text-sm text-gray-500 ">Collaborate with members on this project.</p>
                            </div>
                            <button type="button" id="cancel-invite-btn" class="rounded-full hover:border bg-white text-gray-700 hover:bg-gray-200">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                            </button>
                        </div>
                        <form id="invite-member-form" class="mt-2 space-y-5">
                            <div>
                                <label for="member-search" class="block text-lg font-medium text-gray-700">Email</label>
                                <div class=" flex items-center justify-center w-full gap-1">
                                    <div class="relative flex-1">
                                        <input id="member-search" type="text" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" placeholder="Search by email..." />
                                        <div id="member-suggestions" class="absolute left-0 top-full w-full z-10 mt-1 hidden overflow-hidden rounded-xl border border-gray-200 bg-white shadow">
                                            <!-- suggestions injected here -->
                                        </div>
                                    </div>
                                    <button type="submit" class="rounded-xl bg-gray-800 px-4 py-2 text-white hover:bg-gray-900">Invites</button>
                                </div>
                                <div id="selected-members" class="mt-1 flex flex-wrap gap-2"></div>
                                
                            </div>
                            <div class="flex items-center justify-between pt-1">
                                
                            </div>
                        </form>
                        <div id="current-members-list" class="flex flex-col justify-center gap-2 mt-3">
                            
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <!-- Tải các script cần thiết -->

    <script type="module" src="/js/sidebar.js"></script>
    <script type="module" src="/js/project-sidebar.js"></script>
    <script src="/js/auth.js"></script> <!-- Đảm bảo authFetch có sẵn -->
    <script type="module" src="/js/project-add-members.js"></script>
    <!-- Script chính cho trang này -->
    <script type="module" src="/js/project-detail.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
