<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <script type="module" src="/js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div class="flex h-screen items-stretch">
        <!-- Sidebar sẽ được load vào đây -->
        <div id="sidebar-container" class="h-full shrink-0"></div>

        <!-- Nội dung chính của trang chi tiết project -->
        <main class="flex-1 overflow-y-auto ml-64">
            <header class="flex items-center justify-between p-4 px-6 mt-6">
                <div class="flex flex-row items-center gap-4">
                    <div class="w-20 h-20 flex relative items-center justify-center border rounded-full">
                        <img id="admin-user-avatar" src="" alt="admin-avatar" class="w-full h-full rounded-full object-cover">
                    </div>
                    <div class="flex flex-col gap-3">
                        <h2 id="admin-name" class="text-2xl font-medium">Name...</h2>
                        <div class="flex gap-10 items-center justify-start">
                            <div class="flex flex-col justify-center gap-1">
                                <label for="email" class="text-xs text-gray-400">Email Address:</label>
                                <p id="admin-email" class="text-sm text-gray-800">Email...</p>
                            </div>
                            <div class="flex flex-col justify-center gap-1">
                                <label for="phone" class="text-xs text-gray-400">Phone Number:</label>
                                <p id="admin-phone" class="text-sm text-gray-800">(+84) 123 456 789</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div role="button" class="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-black text-white transition-colors duration-200 hover:bg-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus-icon lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                    Add User
                </div>
            </header>
            <section class="flex flex-col">
                <div class="flex flex-row items-center justify-between border px-6 py-2 bg-gray-50 mb-2">
                    <div class="relative px-2 py-1 border bg-white rounded-lg flex items-center justify-start">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-search-icon lucide-user-search"><circle cx="10" cy="7" r="4"/><path d="M10.3 15H7a4 4 0 0 0-4 4v2"/><circle cx="17" cy="17" r="3"/><path d="m21 21-1.9-1.9"/></svg>
                        <input id="search-user" type="text" placeholder="Search User" class="px-2 py-1 outline-none text-gray-700">
                    </div>
                    <div class="flex flex-row gap-2 items-center">
                        <div role="button" id="sort-user" class="flex items-center justify-center gap-1 border text-gray-600 rounded-md hover:bg-gray-100 px-2 py-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-down-icon lucide-arrow-up-down"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                            Sort
                        </div>
                        <div role="button" id="filter-user" class="flex items-center justify-center gap-1 border text-gray-600 rounded-md hover:bg-gray-100 px-2 py-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-filter-icon lucide-list-filter"><path d="M2 5h20"/><path d="M6 12h12"/><path d="M9 19h6"/></svg>
                            Filter
                        </div>
                    </div>
                </div>
                <div id="user-list" class="px-6"">
                    <!-- Danh sách user sẽ được chèn vào đây -->
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="/js/sidebar.js"></script>
    <script type="module" src="/js/project-modal.js?v=2"></script>
    <script type="module" src="/js/settings-modal.js?v=2"></script>
    <script type="module" src="/js/user-settings-autosave.js?v=1"></script>
    <script type="module" src="/js/admin-user-list.js?v=1"></script>
</body>
</html>
