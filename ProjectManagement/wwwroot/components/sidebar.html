<!-- Modal: Create Project -->
<div id="create-project-backdrop"
    class="fixed inset-0 z-40 hidden bg-black/40 opacity-0 transition-opacity duration-300"></div>
<div id="create-project-modal" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto">
    <div class="min-h-full w-full p-4" id="modal-outer">
        <div id="create-project-content"
            class="mx-auto w-full max-w-lg rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-300 ease-out"
            role="dialog" aria-modal="true">
            <div class="p-6">
                <h2 class="text-2xl font-medium text-gray-900">Create a new project</h2>
                <p class="mt-1 text-sm text-gray-600">Welcome! Create a new project to get started.</p>

                <form id="create-project-form" class="mt-6 space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Project name<span
                                class="text-red-500">*</span></label>
                        <input id="project-create-name" type="text" required
                            class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-black focus:outline-none focus:ring-1 focus:ring-black"
                            placeholder="Project name..." />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="project-create-description" rows="3"
                            class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-black focus:outline-none focus:ring-1 focus:ring-black"
                            placeholder="Project description..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Project Type<span
                                class="text-red-500">*</span></label>
                        <div class="mt-2 space-y-2">
                            <label class="flex items-center">
                                <input type="radio" name="project-type" value="Kanban" checked
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <span class="ml-2 text-sm text-gray-700">Kanban - Quản lý task theo bảng</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="project-type" value="Scrum"
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <span class="ml-2 text-sm text-gray-700">Scrum - Quản lý theo sprint</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Add members</label>
                        <div class="relative">
                            <input id="member-search" type="text"
                                class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-black focus:outline-none focus:ring-1 focus:ring-black"
                                placeholder="Search by email..." />
                            <div id="member-suggestions"
                                class="absolute z-10 mt-1 hidden w-full overflow-hidden rounded-xl border border-gray-200 bg-white shadow">
                                <!-- suggestions injected here -->
                            </div>
                        </div>
                        <div id="selected-members" class="mt-2 flex flex-wrap gap-2"></div>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <button type="button" id="cancel-create-project"
                            class="rounded-xl border border-gray-300 bg-white px-4 py-2 text-gray-700 hover:bg-gray-50">Cancel</button>
                        <button type="submit"
                            class="rounded-xl bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Create
                            project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
