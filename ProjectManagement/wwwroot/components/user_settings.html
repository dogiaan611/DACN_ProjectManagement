<section class="flex-1 overflow-y-auto py-9 px-16" data-settings-root>
    <h2 class="text-xl font-semibold text-gray-900 mb-1">Account</h2>
    <div class="border-b mb-6"></div>
    <!-- avatar and name section -->
    <div class="flex items-start gap-4">
        <!-- Avatar preview -->
        <div class="gap-1 flex flex-col items-center justify-center">
            <div class="relative h-14 w-14 border rounded-full overflow-hidden bg-gray-200 flex items-center justify-center text-gray-600 select-none">
                <img id="us-avatar-preview" alt="avatar preview" class="h-full w-full object-cover hidden" />
                <span id="us-avatar-initial" class="text-xl font-semibold">?</span>
            </div>
            <!-- Upload avatar -->
            <div class="flex items-center justify-center">
                <input type="file" id="avatar-upload-file" accept="image/*" class="hidden" />
                <div role="button" id="avatar-upload-trigger" tabindex="0" aria-label="Upload avatar" class="flex items-center text-sm justify-center text-blue-400 cursor-pointer">Upload image</div>
            </div>
        </div>
        <div class="flex gap-6">
            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input id="us-name" type="text" class="w-full rounded-xl border border-gray-300 px-2 py-1 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 text-gray-600" placeholder="Your name" />
            </div>
            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-700">Phone</label>
                <input id="us-phone" type="text" class="w-full rounded-xl border border-gray-300 px-2 py-1 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" placeholder="(+84) 0123 456 789" />
            </div>
        </div>
    </div>
    <!-- account security section -->
    <div class="mt-8 grid grid-cols-1 gap-4">
        <div class="font-medium text-[16px]">Account Security</div>
        <div class="border-b"></div>
        <div class="flex items-center justify-between">
            <div class="space-y-2">
                <label class="block text-[14px] text-gray-700 font-medium">Email</label>
                <div id="us-email" class="text-gray-500 text-xs"></div>
            </div>
            <div role="button" id="us-password-btn" tabindex="0" aria-label="Change password" class="flex items-center text-sm justify-center border rounded-lg px-3 py-2 font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-100">Change Email</div>
        </div>

        <div class="flex justify-between items-center">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <div id="us-password" class="text-gray-500 text-xs">Change your current password.</div>
            </div>
            <div role="button" id="us-password-btn" tabindex="0" aria-label="Change password" class="flex items-center text-sm justify-center border rounded-lg px-3 py-2 font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-100">Change password</div>
        </div>


    </div>
    <!-- support section -->
    <div class="mt-8 grid grid-cols-1 gap-4">
        <div class="font-medium text-[16px]">Support</div>
        <div class="border-b"></div>

        <div class="flex items-center justify-between">
            <div class="space-y-2">
                <label class="text-[14px] text-red-400 font-normal">Delete my account</label>
                <div id="us-email" class="text-gray-500 text-xs">Permanently delete the account and remove access from all projects.</div>
            </div>
            <div role="button" id="us-password-btn" tabindex="0" aria-label="Change password" class="flex items-center text-sm justify-center border text-red-500 rounded-lg px-3 py-2 font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-100">Delete account</div>
        </div>
    </div>
    <!-- User id section -->
    <div class="mt-8 grid grid-cols-1 gap-4">
        <div class="font-medium text-[16px]">User ID</div>
        <div class="border-b"></div>
        <div class="flex items-center justify-between">
            <div class="space-y-2">
                <div id="us-email" class="text-gray-500 text-xs">User ID</div>
            </div>
            <div id="us-user-id" class="text-gray-500 text-xs"></div>
        </div>
    </div>


    <div class="flex items-center justify-between pt-6">
        <button data-close-settings class="rounded-xl border border-gray-300 bg-white px-4 py-2 text-gray-700 hover:bg-gray-50">Close</button>
        <div class="flex items-center gap-3">
            <div id="auto-save-status" class="text-sm text-gray-500 hidden">
                <span class="inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                    </svg>
                </span>
            </div>
            <!-- <button id="us-save" class="rounded-xl bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">Save changes</button> -->
        </div>
    </div>
</section>
<script src="/js/user-settings-autosave.js?v=1"></script>
