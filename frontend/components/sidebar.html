<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sidebar</title>
    <link rel="stylesheet" href="../src/output.css">
    <link rel="stylesheet" href="../src/fontawesome/css/all.min.css">

</head>
<body class="bg-gray-100">
    <div class="flex min-h-screen">
        <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 shadow-sm flex flex-col">
            <!-- Header section for user info -->
            <div class="px-2 py-1">
                <div class=" hover:bg-gray-50 cursor-pointer flex items-center justify-between w-full rounded-md">
                    <div role="button" class="flex items-center gap-2 px-3 rounded-md">
                        <div class="h-6 w-6 gap-3 rounded bg-gray-200 flex items-center justify-center text-xs font-semibold text-gray-700">L</div>
                        <span class="text-sm font-medium text-gray-800 truncate">Lê Minh Quý's N...</span>
                    </div>
                    <div class="flex items-center h-full mx-auto px-2 py-2 hover:bg-gray-100 rounded-md">
                        <div data-popup-origin="true" style="display: contents;">
                            <div role="button" tabindex="0" aria-label="new project" class="select-none transition-colors ease-in cursor-pointer inline-flex items-center
                                justify-center shrink-0 rounded-tr-sm h-7 w-7 p-0 "><i class="far fa-clone"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main navigation items -->
            <nav class="px-3 space-y-1 pb-2">
                <div data-popup-origin="true" style="display: contents;">
                    <div tabindex="0" role="button" class="select-none transition-colors duration-150 rounded-md flex mx-0 font-medium cursor-pointer hover:bg-gray-100">
                        <div dir="ltr" class="flex items-center w-full text-xs min-h-7 h-8 pt-1 pb-1 px-2">
                            <div class="w-6 h-6 flex items-center justify-center rounded-sm me-2 text-gray-400">
                                <i class="fas fa-magnifying-glass text-base" aria-hidden="true"></i>
                            </div>
                            <div class="flex-auto whitespace-nowrap min-w-0 overflow-hidden overflow-ellipsis text-sm text-gray-400">Search</div>
                        </div>
                    </div>
                </div>
                <div data-popup-origin="true" style="display: contents;">
                    <a href="#" role="link" class="flex no-underline select-none transition-colors duration-150 rounded-md cursor-pointer mx-0 font-medium hover:bg-gray-100">
                        <div dir="ltr" class="flex items-center w-full text-sm min-h-7 h-8 pt-1 pb-1 px-2">
                            <div class="shrink-0 grow-0 rounded-sm w-6 h-6 flex items-center justify-center me-2 text-gray-400">
                                <i class="far fa-house text-base" aria-hidden="true"></i>
                            </div>
                            <div class="flex-auto whitespace-nowrap min-w-0 overflow-hidden overflow-ellipsis text-sm text-gray-400">Home</div>
                        </div>
                    </a>
                </div>
                <div data-popup-origin="true" style="display: contents;">
                    <div role="button" tabindex="0" class="select-none transition-colors duration-150 cursor-pointer rounded-md mx-0 font-medium hover:bg-gray-100">
                        <div dir="ltr" class="flex items-center w-full text-sm max-h-7 h-8 pt-1 pb-1 px-2">
                            <div class="shrink-0 grow-0 rounded-sm w-6 h-6 flex items-center justify-center me-2">
                                <i class="fas fa-inbox text-base text-gray-400" aria-hidden="true"></i>
                            </div>
                            <div class="flex-auto whitespace-nowrap min-w-0 overflow-hidden overflow-ellipsis text-sm text-gray-400">Inbox</div>
                        </div>
                    </div>

                </div>
            </nav>

            <!-- selectable container -->
            <div style="display: contents;">
                <div class="z-10 pt-1.5 grow overflow-x-hidden overflow-y-auto me-0 mb-0">
                    <!-- sticky de cuon -->
                    <div data-sticky-stack-name="default" class="sticky z-[85] w-full top-0 [inset-inline-start:0] h-0 flex-[0_1_0%]"></div>
                    <div class="flex flex-col min-h-full">
                        <div class="flex flex-col gap-3 px-2 pb-5">
                            <div class="m-0 flex flex-col gap-1">
                                <!-- favou section -->
                                <div class="flex flex-col cursor-pointer">
                                    <!-- bookmark header container -->
                                    <div class="px-2 mb-3 w-full flex flex-col gap-0.5">
                                        <div role="button" tabindex="0" id="favourite-bookmark" aria-controls="favourite-bookmark-items" aria-expanded="true" 
                                        class="select-none transition-colors duration-[20ms] eas-in flex items-center rounded-md h-8 px-2 hover:bg-gray-100 cursor-pointer">
                                            <span class="[text-transform:initial] text-[11px] leading-none font-medium text-gray-500 transition-colors duration-100 ease-out">FAVORITES</span>
                                        </div>
                                        <div role="tree" aria-labelledby="favourite-bookmark" id="favourite-bookmark-items" class="block">
                                            <div class="flex flex-col gap-[1px]">
                                                <div class="flex flex-col gap-[1px]">
                                                    <div data-block-id="" class="flex flex-col gap-[1px] pb-0">
                                                        <a href="#" role="treeitem" aria-expanded="false" class="flex text-inherit no-underline select-none transition-colors duration-150 cursor-pointer w-full rounded-md mx-0">
                                                            <div dir="ltr" class="flex items-center justify-center w-full text-sm min-h-[27px] h-[30px] pt-[5px] pb-[5px] px-2 rounded-md">
                                                                <div></div>
                                                            </div>
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="px-3 pt-2 pb-3">
                <div class="px-3 py-1 text-[11px] font-semibold uppercase tracking-wide text-gray-400">Favorites</div>
                <div class="space-y-1">
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-braille text-gray-500"></i>
                        <span class="truncate">Project Timeline</span>
                    </a>
                    <!-- sẽ được add thêm khi thêm vào favou -->
            </div>

            <!-- Shared section -->
            <div class="px-3 pb-3">
                <div class="px-3 py-1 text-[11px] font-semibold uppercase tracking-wide text-gray-400">Shared</div>
                <div class="space-y-1">
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-plus text-gray-500"></i>
                        <span class="truncate">Start collaborating</span>
                    </a>
                </div>
            </div>

            <!-- Private section -->
            <div class="px-3 pb-2">
                <div class="px-3 py-1 text-[11px] font-semibold uppercase tracking-wide text-gray-400">Private</div>
                <div class="space-y-1">
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-spinner text-gray-500"></i>
                        <span class="truncate">Instagram Followers Tra...</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-braille text-gray-500"></i>
                        <span class="truncate">Project Timeline</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-circle text-gray-500 text-[8px] opacity-70"></i>
                        <span class="truncate">Projects</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-check-square text-gray-500"></i>
                        <span class="truncate">Tasks</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-leaf text-gray-500"></i>
                        <span class="truncate">IELTS Speaking Test</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fa-solid fa-book text-gray-500"></i>
                        <span class="truncate">Student Dashboard.</span>
                    </a>
                </div>
            </div>

            <!-- Footer with navigation icons -->
            <div class="mt-auto border-t border-gray-200 px-2 py-2">
                <div class="flex items-center justify-between px-1">
                    <button class="h-8 w-8 inline-flex items-center justify-center rounded-md hover:bg-gray-100 text-gray-600"><i class="fa-solid fa-n"></i></button>
                    <button class="h-8 w-8 inline-flex items-center justify-center rounded-md hover:bg-gray-100 text-gray-600"><i class="fa-solid fa-box-archive"></i></button>
                    <button class="h-8 w-8 inline-flex items-center justify-center rounded-md hover:bg-gray-100 text-gray-600"><i class="fa-solid fa-paper-plane"></i></button>
                    <button class="h-8 w-8 inline-flex items-center justify-center rounded-md hover:bg-gray-100 text-gray-600"><i class="fa-solid fa-cube"></i></button>
                    <button class="h-8 w-8 inline-flex items-center justify-center rounded-md hover:bg-gray-100 text-gray-600"><i class="fa-solid fa-question-circle"></i></button>
                </div>
            </div>
        </aside>
        <main class="flex-1 p-6">
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-4">Main Content</h1>
                <p class="text-gray-600">Nội dung chính của trang sẽ được hiển thị ở đây.</p>
            </div>
        </main>
    </div>
</body>
</html>
