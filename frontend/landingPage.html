<!DOCTYPE html>

                        <div class="xl:flex xl:flex-row xl:items-center [display:none] [grid-column:2] gap-1 justify-center items-center">

                            </span>
                            <div class="flex md:[display:none]">
                                <button type="button" aria-label="Toggle meny" class="border-0 [background:0] cursor-pointer p-[11px] m-[-11px] flex items-center justify-center">
